[iptv-errors]
url = "https://device-errors-api.sgt.net.pl/api/metrics"
cache_ttl = "30"
history_interval = "300"
; opcjonalne — domyślne jak w README (sekcja Konfiguracja):
; errors_url = "https://device-errors-api.sgt.net.pl/api/errors"
; stb_cache_ttl = "600"
; integracja z LibreNMS (lokalizacja dekoderów) — domyślnie WYŁĄCZONA:
; librenms_enabled = "0"
; librenms_url = "https://librenms.alfa-system.net/api/v0"
; librenms_cache_ttl = "600"
; librenms_api_token = ""  ; token NIE jest w tym pliku — ustaw ręcznie w Konfiguracja → Interfejs
